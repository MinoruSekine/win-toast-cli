---

name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  PSScriptAnalyzer:
    runs-on: windows-latest

    permissions:
      pull-requests: write

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@v1.0
        with:
          path: .\
          recurse: true
          output: PSScriptAnalyzer.sarif

      - uses: astral-sh/setup-uv@v7.2.0

      - name: Add GitHub annotations by PSScriptAnalyzer.sarif
        run: |
          uvx --from `
          git+https://github.com/MinoruSekine/sarif2gha.git@abbea6e `
          sarif2gha `
          --project-root-dir="${{ github.workspace }}" PSScriptAnalyzer.sarif
        shell: pwsh

  YAMLLint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: YAMLLint
        uses: karancode/yamllint-github-action@v2.1.1

  markdown-lint:
    name: Lint markdown files.

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: DavidAnson/markdownlint-cli2-action@v20

  Blinter-simple-output:
    name: Lint batchfiles.

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7.2.0

      - run: uv venv

      - run: |
          uv pip install \
          git+https://github.com/MinoruSekine/Blinter-simple-output.git@d685af5

      - run: |
          uv run blinter-simple-output --style github-annotation toast-cli.cmd
